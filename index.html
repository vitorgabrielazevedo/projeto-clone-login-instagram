<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Instagram</title>
        <link rel="stylesheet" href="src/css/styles.css" />
        <link
            rel="shortcut icon"
            href="src/img/instagram-icon.png"
            type="image/x-icon"
        />
    </head>
    <body>
        <main>
            <!-- Área de apresentação -->
            <section id="apresentacao-container">
                <img src="src/img/instagram-logo.png" alt="Logo do Instagram" />
                <h1>
                    Veja os momentos do dia a dia dos seus
                    <span>amigos mais próximos</span>.
                </h1>
                <div id="imagem-apresentacao">
                    <img src="src/img/instagram.png" alt="Instagram" />
                </div>
            </section>
            <!-- Área do login -->
            <section id="form-container">
                <h2>Faça login no Instagram</h2>
                <form>
                    <input
                        type="text "
                        name="usuario"
                        id="usuario"
                        placeholder="Número de celular, nome de usuário ou e-mail"
                    />
                    <input
                        type="password"
                        name="senha"
                        id="senha"
                        placeholder="Senha"
                    />
                    <button id="login-btn">Conecte-se</button>
                </form>
                <div id="redefinir-senha">
                    <a href="#">Esqueceu sua senha?</a>
                </div>
                <div id="facebook-container">
                    <div id="facebook-logo">
                        <img
                            src="src/img/facebook-logo.png"
                            alt="Logo do Facebook"
                        />
                    </div>
                    <button>Entrar com o Facebook</button>
                </div>
                <div id="criar-conta-container">
                    <a href="#">Criar nova conta</a>
                </div>
                <div id="meta-container">
                    <img src="src/img/meta-logo.png" alt="Logo da Meta" />
                </div>
            </section>
        </main>
    </body>
</html>
